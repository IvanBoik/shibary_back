name: Deploy to server

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          debug: true
          envs: ALL_SECRETS
          script: |
            set -e
            REPO_DIR=/home/deploy/shibary_back
            REPO_URL=https://github.com/${{ github.repository }}.git
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone "$REPO_URL" "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch --all
            git reset --hard origin/master

            # формируем .env из всех секретов репозитория (ALL_SECRETS — JSON),
            # исключая инфраструктурные ключи. Новые секреты подхватываются
            # автоматически, без правки workflow.
            umask 077
            TMP_ENV="$(mktemp .env.XXXXXX)"
            echo "$ALL_SECRETS" | jq -r '
              ["SSH_HOST","SSH_USER","SSH_KEY","github_token"] as $exclude
              | to_entries[]
              | select(.key as $k | $exclude | index($k) | not)
              | "\(.key)=\(.value)"
            ' > "$TMP_ENV"
            chmod 600 "$TMP_ENV"
            mv "$TMP_ENV" .env

            # тянем только внешние образы; shibary-back/shibary-admin
            # собираются локально из Dockerfile (см. build: .)
            docker compose pull postgres libretranslate
            docker compose up -d --build --force-recreate shibary-back shibary-admin
            docker image prune -f
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
