name: Update secrets

on:
  workflow_dispatch:
    inputs:
      restart:
        description: "Recreate shibary-back container to pick up new env"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  update-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Update .env via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          debug: false
          envs: ALL_SECRETS,RESTART
          script: |
            set -e
            REPO_DIR=/home/deploy/shibary_back
            cd "$REPO_DIR"

            # пишем .env атомарно: сначала во временный файл, потом mv
            umask 077
            TMP_ENV="$(mktemp .env.XXXXXX)"

            # ALL_SECRETS — это JSON со всеми секретами репозитория.
            # Берём все ключи, кроме инфраструктурных (SSH-доступ и github_token).
            echo "$ALL_SECRETS" | jq -r '
              ["SSH_HOST","SSH_USER","SSH_KEY","github_token"] as $exclude
              | to_entries[]
              | select(.key as $k | $exclude | index($k) | not)
              | "\(.key)=\(.value)"
            ' > "$TMP_ENV"

            chmod 600 "$TMP_ENV"
            mv "$TMP_ENV" .env

            if [ "$RESTART" = "true" ]; then
              docker compose up -d --force-recreate --no-build shibary-back
            else
              echo ".env updated. Container NOT restarted (manual restart required)."
            fi
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          RESTART: ${{ inputs.restart }}
