services:
  postgres:
    image: postgres:17-alpine
    container_name: shibary-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shibary
      POSTGRES_USER: shibary
      POSTGRES_PASSWORD: shibary
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Gate dependent services until the DB accepts connections, so Liquibase migrations
    # (run on app startup) don't fail trying to connect to a not-yet-ready Postgres.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shibary -d shibary"]
      interval: 5s
      timeout: 5s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: shibary-libretranslate
    restart: unless-stopped
    ports:
      - "5000:5000"
    tty: true
    environment:
      LT_LOAD_ONLY: "en,ru"
      LT_DISABLE_WEB_UI: "true"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    volumes:
      - libretranslate-api-keys:/app/db
      - libretranslate-models:/home/libretranslate/.local:rw

  shibary-back:
    build: .
    image: shibary-back:latest
    container_name: shibary-back
    restart: unless-stopped
    ports:
      - "9090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      libretranslate:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shibary
      DB_USERNAME: shibary
      DB_PASSWORD: shibary
      CHAD_API_KEY: ${CHAD_API_KEY}
      LIBRETRANSLATE_URL: http://libretranslate:5000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SBA_CLIENT_URL: http://shibary-admin:8080/admin
      SBA_SERVICE_BASE_URL: http://shibary-back:8080
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      S3_ALLOWED_ORIGINS: ${S3_ALLOWED_ORIGINS}

  shibary-admin:
    build:
      context: .
      args:
        GRADLE_TASK: ":sba-server:bootJar"
        JAR_DIR: "sba-server/build/libs"
    image: shibary-admin:latest
    container_name: shibary-admin
    restart: unless-stopped
    ports:
      - "9091:8080"
    env_file:
      - .env
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # SMTP + recipients for status-change email alerts (see sba-server application.yaml).
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SBA_MAIL_FROM: ${SBA_MAIL_FROM:-${MAIL_USERNAME}}
      SBA_MAIL_TO: ${SBA_MAIL_TO}


volumes:
  pgdata:
  libretranslate-api-keys:
  libretranslate-models:
