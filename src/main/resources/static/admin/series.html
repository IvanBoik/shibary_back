<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление сериалами</title>
  <style>
    :root { --bg: #f5f6f8; --card: #fff; --border: #e2e5ea; --primary: #2563eb; --danger: #dc2626; --warn: #d97706; --ok: #16a34a; --muted: #6b7280; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #111827; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    header h1 { margin: 0; font-size: 20px; flex: 1; }
    header a { text-decoration: none; }
    header button { background: #fff; color: #111827; border: 1px solid var(--border); }
    header button:hover { background: var(--bg); }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .card h2 { margin: 0 0 16px; font-size: 16px; }
    h3 { font-size: 14px; margin: 16px 0 8px; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: var(--muted); }
    input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; min-width: 200px; }
    input[type=file] { padding: 6px; }
    button { padding: 8px 14px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; color: #fff; background: var(--primary); }
    button.secondary { background: var(--warn); }
    button.danger { background: var(--danger); }
    button.ghost { background: #fff; color: #111827; border: 1px solid var(--border); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: var(--bg); }
    #message { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    #message.error { background: #fee2e2; color: var(--danger); display: block; }
    #message.success { background: #dcfce7; color: var(--ok); display: block; }
    .empty { color: var(--muted); padding: 16px 0; }
    .season { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .season-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .season-head h3 { margin: 0; flex: 1; }
    /* Wrapper div (not the <td> itself) is flex, so the cell keeps table-cell layout and its
       bottom border stays aligned with the other cells in the row. */
    .row-actions { display: flex; gap: 8px; align-items: center; }
    a.link { color: var(--primary); cursor: pointer; }
    .hidden { display: none; }
    /* Episode edit form shown inline instead of the row's normal cells. */
    .episode-edit td { background: #f9fafb; }
    .episode-edit .field { display: inline-flex; flex-direction: column; gap: 4px; margin-right: 12px; }
    .episode-edit input { min-width: 140px; }
    .episode-edit .edit-actions { margin-top: 10px; display: flex; gap: 8px; }
  </style>
</head>
<body>
<header>
  <h1>Управление сериалами</h1>
  <a href="/admin/users.html"><button type="button">Пользователи</button></a>
  <form method="post" action="/logout"><button type="submit">Выйти</button></form>
</header>
<main>
  <div id="message"></div>

  <!-- ============ LIST VIEW ============ -->
  <div id="listView">
    <div class="card">
      <h2>Создать сериал</h2>
      <form id="createSeriesForm">
        <div class="field"><label>Название (RU)</label><input id="c_title_ru" required></div>
        <div class="field"><label>Название (EN)</label><input id="c_title_en" required></div>
        <div class="field"><label>Жанр (RU)</label><input id="c_genre_ru" required></div>
        <div class="field"><label>Жанр (EN)</label><input id="c_genre_en" required></div>
        <div class="field"><label>Сложность (RU)</label><input id="c_difficulty_ru" required></div>
        <div class="field"><label>Сложность (EN)</label><input id="c_difficulty_en" required></div>
        <div class="field"><label>Акцент (RU)</label><input id="c_accent_ru" required></div>
        <div class="field"><label>Акцент (EN)</label><input id="c_accent_en" required></div>
        <div class="field"><label>Года выпуска</label><input id="c_years" type="text" pattern="\d{4}(-\d{4})?" required placeholder="2009-2013"></div>
        <div class="field"><label>Картинка</label><input id="c_image" type="file" accept="image/*" required></div>
        <button type="submit" id="createSeriesBtn">Создать</button>
      </form>
    </div>

    <div class="card">
      <h2>Сериалы (<span id="count">0</span>)</h2>
      <table>
        <thead><tr><th></th><th>Название</th><th>Жанр</th><th>Сезонов</th><th>Действия</th></tr></thead>
        <tbody id="seriesBody"></tbody>
      </table>
      <div id="empty" class="empty hidden">Сериалов пока нет.</div>
    </div>
  </div>

  <!-- ============ DETAIL VIEW ============ -->
  <div id="detailView" class="hidden">
    <div class="card">
      <a class="link" id="backLink">← К списку</a>
      <h2 id="detailTitle" style="margin-top:12px"></h2>
      <div id="detailMeta" class="empty"></div>
    </div>

    <div class="card">
      <h2>Добавить сезон</h2>
      <form id="createSeasonForm">
        <div class="field"><label>Номер сезона</label><input id="s_number" type="number" min="1" required></div>
        <button type="submit">Добавить сезон</button>
      </form>
    </div>

    <div class="card">
      <h2>Сезоны и серии</h2>
      <div id="seasonsContainer"></div>
      <div id="seasonsEmpty" class="empty hidden">Сезонов пока нет.</div>
    </div>
  </div>
</main>

<script>
  const API = "/admin/api/series";
  const state = { currentSeriesId: null };

  function showMessage(text, type) {
    const el = document.getElementById("message");
    el.textContent = text;
    el.className = type;
    if (type === "success") setTimeout(() => { el.className = ""; }, 4000);
  }

  async function request(url, options) {
    const res = await fetch(url, options);
    // Session expired/unauthenticated: form-login replies with a 302 to /login that fetch follows
    // (res.redirected + res.url), or the endpoint returns 401/403 directly. Bounce to login.
    if (res.status === 401 || res.status === 403 || (res.redirected && res.url.includes("/login"))) {
      window.location.href = "/login";
      throw new Error("Требуется вход");
    }
    if (res.status === 204) return null;
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const msg = data && data.error ? `${data.error.code}: ${data.error.message}` : `Ошибка ${res.status}`;
      throw new Error(msg);
    }
    // A 200 with a non-JSON body usually means we silently got the login page; fail loudly.
    if (data === null) {
      window.location.href = "/login";
      throw new Error("Сессия истекла, войдите заново");
    }
    return data;
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Direct browser -> S3 upload via a presigned PUT URL. Returns the stable object key.
  async function uploadFile(type, file) {
    const presign = await request(`${API}/uploads/presign`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, fileName: file.name, contentType: file.type || "application/octet-stream" }),
    });
    const putRes = await fetch(presign.uploadUrl, {
      method: "PUT",
      headers: { "Content-Type": file.type || "application/octet-stream" },
      body: file,
    });
    if (!putRes.ok) throw new Error(`Не удалось загрузить файл в хранилище (${putRes.status})`);
    return presign.key;
  }

  function loc(ru, en) { return { ru: document.getElementById(ru).value.trim(), en: document.getElementById(en).value.trim() }; }

  // ----- List view ---------------------------------------------------------------------------

  function renderList(items) {
    document.getElementById("count").textContent = items.length;
    document.getElementById("empty").classList.toggle("hidden", items.length > 0);
    document.getElementById("seriesBody").innerHTML = items.map(s => `
      <tr>
        <td><img class="thumb" src="${escapeHtml(s.imageUrl)}" alt=""></td>
        <td>${escapeHtml(s.title.ru)}<br><span class="empty">${escapeHtml(s.title.en)}</span></td>
        <td>${escapeHtml(s.genre.ru)}</td>
        <td>${s.seasonsCount}</td>
        <td>
          <div class="row-actions">
            <button class="ghost" data-action="open" data-id="${s.id}">Открыть</button>
            <button class="danger" data-action="delete" data-id="${s.id}">Удалить</button>
          </div>
        </td>
      </tr>`).join("");
  }

  async function loadList() {
    try { renderList(await request(API)); }
    catch (e) { showMessage(e.message, "error"); }
  }

  document.getElementById("createSeriesForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("createSeriesBtn");
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Загрузка…";
    try {
      const imageKey = await uploadFile("IMAGE", document.getElementById("c_image").files[0]);
      btn.textContent = "Сохранение…";
      await request(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: loc("c_title_ru", "c_title_en"),
          genre: loc("c_genre_ru", "c_genre_en"),
          difficulty: loc("c_difficulty_ru", "c_difficulty_en"),
          accent: loc("c_accent_ru", "c_accent_en"),
          releaseYears: document.getElementById("c_years").value.trim(),
          imageKey,
        }),
      });
      e.target.reset();
      showMessage("Сериал создан", "success");
      await loadList();
    } catch (err) {
      showMessage(err.message, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });

  document.getElementById("seriesBody").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "open") { openDetail(id); return; }
    if (btn.dataset.action === "delete") {
      if (!confirm("Удалить сериал со всеми сезонами и сериями?")) return;
      btn.disabled = true;
      try { await request(`${API}/${id}`, { method: "DELETE" }); showMessage("Сериал удалён", "success"); await loadList(); }
      catch (err) { showMessage(err.message, "error"); btn.disabled = false; }
    }
  });

  // ----- Detail view -------------------------------------------------------------------------

  function showList() {
    state.currentSeriesId = null;
    document.getElementById("detailView").classList.add("hidden");
    document.getElementById("listView").classList.remove("hidden");
    loadList();
  }

  async function openDetail(id) {
    state.currentSeriesId = id;
    document.getElementById("listView").classList.add("hidden");
    document.getElementById("detailView").classList.remove("hidden");
    try {
      const s = await request(`${API}/${id}`);
      document.getElementById("detailTitle").textContent = `${s.title.ru} / ${s.title.en}`;
      document.getElementById("detailMeta").innerHTML = `
        Жанр: ${escapeHtml(s.genre.ru)} / ${escapeHtml(s.genre.en)} ·
        Сложность: ${escapeHtml(s.difficulty.ru)} / ${escapeHtml(s.difficulty.en)} ·
        Акцент: ${escapeHtml(s.accent.ru)} / ${escapeHtml(s.accent.en)} ·
        Годы: ${escapeHtml(s.releaseYears)} · Сезонов: ${s.seasonsCount}`;
      await loadSeasons();
    } catch (e) {
      showMessage(e.message, "error");
    }
  }

  function renderSeasons(seasons) {
    document.getElementById("seasonsEmpty").classList.toggle("hidden", seasons.length > 0);
    document.getElementById("seasonsContainer").innerHTML = seasons.map(season => `
      <div class="season">
        <div class="season-head">
          <h3>Сезон ${season.number}</h3>
          <button class="danger" data-action="del-season" data-id="${season.id}">Удалить сезон</button>
        </div>
        <table>
          <thead><tr><th>№</th><th>Название</th><th>Видео</th><th>Субтитры</th><th></th></tr></thead>
          <tbody>
            ${season.episodes.map(ep => `
              <tr data-episode-id="${ep.id}">
                <td>${ep.number}</td>
                <td>${escapeHtml(ep.title)}</td>
                <td><a class="link" href="${escapeHtml(ep.videoUrl)}" target="_blank">видео</a></td>
                <td>
                  <a class="link" href="${escapeHtml(ep.subtitlesRuUrl)}" target="_blank">RU</a> /
                  <a class="link" href="${escapeHtml(ep.subtitlesEnUrl)}" target="_blank">EN</a>
                </td>
                <td>
                  <div class="row-actions">
                    <button class="ghost" data-action="edit-episode" data-id="${ep.id}" data-number="${ep.number}" data-title="${escapeHtml(ep.title)}">Редактировать</button>
                    <button class="danger" data-action="del-episode" data-id="${ep.id}">Удалить</button>
                  </div>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>
        <h3>Добавить серию</h3>
        <div class="episodeForm" data-season="${season.id}">
          <div class="field"><label>Номер</label><input name="number" type="number" min="1" required></div>
          <div class="field"><label>Название (EN)</label><input name="title" required></div>
          <div class="field"><label>Видео</label><input name="video" type="file" accept="video/*" required></div>
          <div class="field"><label>Субтитры RU</label><input name="sub_ru" type="file" required></div>
          <div class="field"><label>Субтитры EN</label><input name="sub_en" type="file" required></div>
          <button type="button" data-action="add-episode">Добавить серию</button>
        </div>
      </div>`).join("");
  }

  async function loadSeasons() {
    try { renderSeasons(await request(`${API}/${state.currentSeriesId}/seasons`)); }
    catch (e) { showMessage(e.message, "error"); }
  }

  document.getElementById("backLink").addEventListener("click", showList);

  document.getElementById("createSeasonForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await request(`${API}/${state.currentSeriesId}/seasons`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ number: Number(document.getElementById("s_number").value) }),
      });
      e.target.reset();
      showMessage("Сезон добавлен", "success");
      await loadSeasons();
    } catch (err) {
      showMessage(err.message, "error");
    }
  });

  // Season/episode actions are delegated from the static container. Episode creation is a plain
  // button (not a <form> submit) so the request always carries a JSON body — a native multipart
  // form submission would reach the API with no JSON body and fail with "request body is missing".
  document.getElementById("seasonsContainer").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === "add-episode") { await addEpisode(btn); return; }
    if (action === "edit-episode") { showEpisodeEditRow(btn); return; }
    if (action === "cancel-edit") { await loadSeasons(); return; }
    if (action === "save-episode") { await saveEpisode(btn); return; }
    const id = btn.dataset.id;
    if (action === "del-season" && !confirm("Удалить сезон со всеми сериями?")) return;
    if (action === "del-episode" && !confirm("Удалить серию?")) return;
    btn.disabled = true;
    try {
      if (action === "del-season") {
        await request(`${API}/seasons/${id}`, { method: "DELETE" });
        showMessage("Сезон удалён", "success");
      } else if (action === "del-episode") {
        await request(`${API}/episodes/${id}`, { method: "DELETE" });
        showMessage("Серия удалена", "success");
      } else { return; }
      await loadSeasons();
    } catch (err) {
      showMessage(err.message, "error");
      btn.disabled = false;
    }
  });

  // Reads the per-season episode inputs, uploads the three media files to S3, then creates the
  // episode atomically. All fields are mandatory.
  async function addEpisode(btn) {
    const box = btn.closest(".episodeForm");
    const field = (name) => box.querySelector(`[name="${name}"]`);
    const number = field("number").value.trim();
    const title = field("title").value.trim();
    const videoFile = field("video").files[0];
    const subRuFile = field("sub_ru").files[0];
    const subEnFile = field("sub_en").files[0];
    if (!number || !title || !videoFile || !subRuFile || !subEnFile) {
      showMessage("Заполните все поля и выберите все файлы серии", "error");
      return;
    }
    const originalText = btn.textContent;
    // Uploading large media to S3 takes a while; show progress so the page doesn't look frozen.
    btn.disabled = true;
    btn.textContent = "Загрузка файлов…";
    try {
      // Upload all three media files first; episode creation on the server is atomic.
      const [videoKey, subtitlesRuKey, subtitlesEnKey] = await Promise.all([
        uploadFile("VIDEO", videoFile),
        uploadFile("SUBTITLES", subRuFile),
        uploadFile("SUBTITLES", subEnFile),
      ]);
      btn.textContent = "Сохранение…";
      await request(`${API}/seasons/${box.dataset.season}/episodes`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          number: Number(number),
          title,
          videoKey, subtitlesRuKey, subtitlesEnKey,
        }),
      });
      showMessage(`Серия ${number} добавлена`, "success");
      await loadSeasons();
    } catch (err) {
      showMessage(err.message, "error");
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  // Replaces the episode row with an inline edit form. Files are optional: an empty file input
  // keeps the current file, a chosen file replaces it (the old object is deleted server-side).
  function showEpisodeEditRow(btn) {
    const row = btn.closest("tr");
    row.classList.add("episode-edit");
    row.innerHTML = `
      <td colspan="5" data-id="${btn.dataset.id}">
        <div class="field"><label>Номер</label><input name="e_number" type="number" min="1" value="${btn.dataset.number}"></div>
        <div class="field"><label>Название (EN)</label><input name="e_title" value="${escapeHtml(btn.dataset.title)}"></div>
        <div class="field"><label>Видео (оставьте пустым, чтобы не менять)</label><input name="e_video" type="file" accept="video/*"></div>
        <div class="field"><label>Субтитры RU</label><input name="e_sub_ru" type="file"></div>
        <div class="field"><label>Субтитры EN</label><input name="e_sub_en" type="file"></div>
        <div class="edit-actions">
          <button data-action="save-episode" data-id="${btn.dataset.id}">Сохранить</button>
          <button class="ghost" data-action="cancel-edit">Отмена</button>
        </div>
      </td>`;
  }

  // Saves episode edits: uploads only the files that were changed, sends nulls for the rest so the
  // server keeps existing files; replaced files are deleted server-side.
  async function saveEpisode(btn) {
    const cell = btn.closest("td");
    const field = (name) => cell.querySelector(`[name="${name}"]`);
    const number = field("e_number").value.trim();
    const title = field("e_title").value.trim();
    if (!number || !title) {
      showMessage("Номер и название обязательны", "error");
      return;
    }
    const videoFile = field("e_video").files[0];
    const subRuFile = field("e_sub_ru").files[0];
    const subEnFile = field("e_sub_en").files[0];
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = (videoFile || subRuFile || subEnFile) ? "Загрузка файлов…" : "Сохранение…";
    try {
      // Upload only changed files (null → keep current on the server).
      const [videoKey, subtitlesRuKey, subtitlesEnKey] = await Promise.all([
        videoFile ? uploadFile("VIDEO", videoFile) : Promise.resolve(null),
        subRuFile ? uploadFile("SUBTITLES", subRuFile) : Promise.resolve(null),
        subEnFile ? uploadFile("SUBTITLES", subEnFile) : Promise.resolve(null),
      ]);
      btn.textContent = "Сохранение…";
      await request(`${API}/episodes/${btn.dataset.id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ number: Number(number), title, videoKey, subtitlesRuKey, subtitlesEnKey }),
      });
      showMessage(`Серия ${number} обновлена`, "success");
      await loadSeasons();
    } catch (err) {
      showMessage(err.message, "error");
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  loadList();
</script>
</body>
</html>
