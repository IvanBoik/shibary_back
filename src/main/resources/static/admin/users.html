<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление пользователями</title>
  <style>
    :root { --bg: #f5f6f8; --card: #fff; --border: #e2e5ea; --primary: #2563eb; --danger: #dc2626; --warn: #d97706; --ok: #16a34a; --muted: #6b7280; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #111827; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    header h1 { margin: 0; font-size: 20px; flex: 1; }
    header form { margin: 0; }
    header button { background: #fff; color: #111827; border: 1px solid var(--border); }
    header button:hover { background: var(--bg); }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .card h2 { margin: 0 0 16px; font-size: 16px; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: var(--muted); }
    input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; min-width: 200px; }
    button { padding: 8px 14px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; color: #fff; background: var(--primary); }
    button.secondary { background: var(--warn); }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.ok { background: #dcfce7; color: var(--ok); }
    .badge.banned { background: #fee2e2; color: var(--danger); }
    .badge.pending { background: #fef3c7; color: var(--warn); }
    button.success { background: var(--ok); }
    .actions { display: flex; gap: 8px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
    #message { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    #message.error { background: #fee2e2; color: var(--danger); display: block; }
    #message.success { background: #dcfce7; color: var(--ok); display: block; }
    .empty { color: var(--muted); padding: 16px 0; }
    .pagination { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .pagination .info { color: var(--muted); font-size: 13px; }
    .pagination .spacer { flex: 1; }
    .pagination select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; min-width: auto; }
    .pagination button { background: #fff; color: #111827; border: 1px solid var(--border); }
    .pagination button:not(:disabled):hover { background: var(--bg); }
  </style>
</head>
<body>
<header>
  <h1>Управление пользователями</h1>
  <a href="/admin/series.html"><button type="button">Сериалы</button></a>
  <form method="post" action="/logout"><button type="submit">Выйти</button></form>
</header>
<main>
  <div id="message"></div>

  <div class="card">
    <h2>Создать пользователя</h2>
    <form id="createForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="off">
      </div>
      <div class="field">
        <label for="password">Пароль (минимум 6 символов)</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="displayName">Имя (необязательно)</label>
        <input type="text" id="displayName" autocomplete="off">
      </div>
      <button type="submit">Создать</button>
    </form>
  </div>

  <div class="card">
    <h2>Пользователи (<span id="count">0</span>)</h2>
    <table>
      <thead>
      <tr><th>Email</th><th>Имя</th><th>ID</th><th>Статус</th><th>Email подтверждён</th><th>Действия</th></tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">Пользователей пока нет.</div>
    <div class="pagination">
      <label class="info" for="pageSize">На странице:</label>
      <select id="pageSize">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
      <span class="spacer"></span>
      <span class="info" id="pageInfo"></span>
      <button id="prevPage" type="button">← Назад</button>
      <button id="nextPage" type="button">Вперёд →</button>
    </div>
  </div>
</main>

<script>
  const API = "/admin/api/users";

  const state = { page: 0, size: 20, totalPages: 0 };


  function showMessage(text, type) {
    const el = document.getElementById("message");
    el.textContent = text;
    el.className = type;
    if (type === "success") setTimeout(() => { el.className = ""; }, 4000);
  }

  async function request(url, options) {
    const res = await fetch(url, options);
    // Session expired or unauthenticated: form-login replies with a 302 to /login that fetch follows
    // (res.redirected + res.url), or the endpoint returns 401/403 directly. Bounce to login.
    if (res.status === 401 || res.status === 403 || (res.redirected && res.url.includes("/login"))) {
      window.location.href = "/login";
      throw new Error("Требуется вход");
    }
    if (res.status === 204) return null;
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const msg = data && data.error ? `${data.error.code}: ${data.error.message}` : `Ошибка ${res.status}`;
      throw new Error(msg);
    }
    return data;
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderRows(users) {
    const body = document.getElementById("usersBody");
    document.getElementById("empty").style.display = users.length ? "none" : "block";
    body.innerHTML = users.map(u => `
      <tr>
        <td>${escapeHtml(u.email) || "<i>—</i>"}</td>
        <td>${escapeHtml(u.displayName) || "<i>—</i>"}</td>
        <td class="mono">${escapeHtml(u.id)}</td>
        <td>${u.banned ? '<span class="badge banned">Забанен</span>' : '<span class="badge ok">Активен</span>'}</td>
        <td>${u.emailVerified ? '<span class="badge ok">Подтверждён</span>' : '<span class="badge pending">Не подтверждён</span>'}</td>
        <td class="actions">
          ${u.emailVerified ? "" : `<button class="success" data-action="verify" data-id="${u.id}">Верифицировать</button>`}
          <button class="secondary" data-action="ban" data-id="${u.id}" data-banned="${u.banned}">
            ${u.banned ? "Разбанить" : "Забанить"}
          </button>
          <button class="danger" data-action="delete" data-id="${u.id}">Удалить</button>
        </td>
      </tr>`).join("");
  }

  function renderPagination(pageData) {
    state.page = pageData.page;
    state.size = pageData.size;
    state.totalPages = pageData.totalPages;
    document.getElementById("count").textContent = pageData.totalItems;
    const human = pageData.totalPages === 0 ? 0 : pageData.page + 1;
    document.getElementById("pageInfo").textContent = `Страница ${human} из ${pageData.totalPages}`;
    document.getElementById("prevPage").disabled = pageData.page <= 0;
    document.getElementById("nextPage").disabled = pageData.page >= pageData.totalPages - 1;
  }

  async function load() {
    try {
      const pageData = await request(`${API}?page=${state.page}&size=${state.size}`);
      // If the current page became empty after a deletion, step back to the last non-empty page.
      if (pageData.items.length === 0 && pageData.page > 0 && pageData.totalPages > 0) {
        state.page = pageData.totalPages - 1;
        return load();
      }
      renderRows(pageData.items);
      renderPagination(pageData);
    } catch (e) {
      showMessage(e.message, "error");
    }
  }

  document.getElementById("prevPage").addEventListener("click", () => {
    if (state.page > 0) { state.page--; load(); }
  });

  document.getElementById("nextPage").addEventListener("click", () => {
    if (state.page < state.totalPages - 1) { state.page++; load(); }
  });

  document.getElementById("pageSize").addEventListener("change", (e) => {
    state.size = Number(e.target.value);
    state.page = 0;
    load();
  });

  document.getElementById("createForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const displayName = document.getElementById("displayName").value.trim();
    try {
      await request(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, displayName: displayName || null }),
      });
      e.target.reset();
      showMessage(`Пользователь ${email} создан`, "success");
      state.page = 0; // The new user is the newest, shown on the first page.
      await load();
    } catch (err) {
      showMessage(err.message, "error");
    }
  });

  document.getElementById("usersBody").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    btn.disabled = true;
    try {
      if (action === "delete") {
        if (!confirm("Удалить пользователя безвозвратно?")) return;
        await request(`${API}/${id}`, { method: "DELETE" });
        showMessage("Пользователь удалён", "success");
      } else if (action === "ban") {
        const ban = btn.dataset.banned !== "true";
        await request(`${API}/${id}/ban?banned=${ban}`, { method: "POST" });
        showMessage(ban ? "Пользователь забанен" : "Пользователь разбанен", "success");
      } else if (action === "verify") {
        await request(`${API}/${id}/verify-email`, { method: "POST" });
        showMessage("Email пользователя подтверждён", "success");
      }
      await load();
    } catch (err) {
      showMessage(err.message, "error");
    } finally {
      btn.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
