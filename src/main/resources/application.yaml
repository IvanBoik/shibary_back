spring:
  application:
    name: shibary_back
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shibary}
    username: ${DB_USERNAME:shibary}
    password: ${DB_PASSWORD:shibary}
  sql:
    init:
      mode: always
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

chad:
  api:
    key: chad-521f2bbdce924f3099b5d7b9b87aeec2tixjo1r1
    url: https://ask.chadgpt.ru/api/public/gemini-3.1-flash-lite
    sentence-count: 10

libretranslate:
  url: ${LIBRETRANSLATE_URL:http://localhost:5000}
  api-key: ${LIBRETRANSLATE_API_KEY:}
  source-lang: en
  target-lang: ru

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ResponseBodyEmitter: ERROR
    org.springframework.web.context.request.async.StandardServletAsyncWebRequest: ERROR
    org.apache.catalina.connector.ClientAbortException: OFF
  file:
    name: logs/shibary.log
  pattern:
    rolling-file-name: logs/shibary-%d{yyyy-MM-dd}.%i.log

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    logfile:
      external-file: logs/shibary.log
    loggers:
      access: unrestricted
    health:
      show-details: always

spring.boot.admin:
  context-path: /admin
  client:
    url: ${SBA_CLIENT_URL:http://localhost:${server.port}/admin}
    username: ${admin.security.username}
    password: ${admin.security.password}
    instance:
      service-base-url: ${SBA_SERVICE_BASE_URL:http://localhost:${server.port}}
      name: ${spring.application.name}
      metadata:
        user.name: ${admin.security.username}
        user.password: ${admin.security.password}

auth:
  jwt-secret: ${JWT_SECRET:dev-only-change-me-please-use-env-secret-with-32-chars}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  access-ttl-seconds: ${ACCESS_TTL_SECONDS}
  refresh-ttl-days: ${REFRESH_TTL_DAYS}
  google-web-client-id: ${GOOGLE_WEB_CLIENT_ID}
  email-verification:
    code-ttl-seconds: ${EMAIL_CODE_TTL_SECONDS}
    resend-cooldown-seconds: ${EMAIL_RESEND_COOLDOWN_SECONDS}
    max-attempts: ${EMAIL_CODE_MAX_ATTEMPTS}
    code-length: ${EMAIL_CODE_LENGTH}
    mail-from: ${EMAIL_MAIL_FROM}

admin:
  security:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
