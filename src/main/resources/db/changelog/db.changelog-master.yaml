# Liquibase master changelog. Applied automatically on application startup.
# Each migration lives in its own file and is included here in order.
databaseChangeLog:
  - include:
      file: db/changelog/0001-baseline.sql
  - include:
      file: db/changelog/0002-series-library.sql
  - include:
      file: db/changelog/0003-series-release-years-text.sql
