# Profile for the standalone Spring Boot Admin server container.
#
# In this profile only the admin UI/server is active (see AdminServerConfig):
#   - the SBA client self-registration is disabled (this process must not monitor itself);
#   - schema initialization is turned off (the main application owns the schema).
# Monitored applications register themselves here via their SBA client.
spring:
  application:
    name: shibary_admin
  # No business layer in this profile, so the admin server needs no database at all.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  sql:
    init:
      mode: never
  boot:
    admin:
      client:
        enabled: false
      ui:
        # Extra link in the SBA navigation pointing to the user-management page.
        # The page is served by the main application (which owns the database), so this must be an
        # absolute URL reachable from the operator's browser (override per environment).
        external-views:
          - label: "Users"
            url: ${ADMIN_USERS_VIEW_URL:http://localhost:8080/admin/users.html}
            order: 2000
            iframe: false

